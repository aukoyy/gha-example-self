name: dispatch-infra-dev

on:
  workflow_dispatch:
  push:

jobs:
  print-env:
    runs-on: ubuntu-latest
    steps:
      - name: Print ENV
        run: env
  dispatch-remote:
    runs-on: ubuntu-latest
    steps:
      - name: dispatch
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }} # I am missing the token step!
          script: |
            console.log('Dispatching remote workflow')
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'yoda-driftet-plattform-ops',
              workflow_id: 'dispatch-build-ecr-dev.yml',
              ref: 'main',
            });
